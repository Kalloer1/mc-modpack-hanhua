# 手动触发:输入一个 CurseForge 整合包链接 → main.py 跑翻译 → 产物 commit 回仓库。
# 产物结构:packs/{source}/{projectID}/{fileID}/ 下按 quests 相对路径落地
# (lang→lang/zh_cn.snbt;硬编码→chapters/*.snbt 等)+ patch.zip + meta.json,
# 根目录 index.json 由 src/index_store.py 维护。
# 面向玩家的 issue 提交通道见 on-issue.yml。
name: Translate Modpack

on:
  workflow_dispatch:
    inputs:
      cf_url:
        description: "CurseForge 整合包链接(整包页或某版本/文件页)"
        required: true
        type: string
      force:
        description: "已 done 的包也重新翻译(验证/纠错用)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    name: Fetch & Translate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Self-test index store
        run: python -m src.index_store selftest

      # 退出码:0=done(或此前已汉化) / 2=no_ftbq / 1=failed / 3=环境未就绪
      - name: Translate modpack
        id: translate
        env:
          CF_URL: ${{ inputs.cf_url }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=("$CF_URL")
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          set +e
          python main.py "${args[@]}" 2>&1 | tee /tmp/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # main.py 输出尾部写进 job summary(main.py 从不回显 key),便于失败时直接在 Actions 页排查。
      - name: Show run log tail
        if: ${{ always() }}
        run: |
          echo '### main.py 输出尾部' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 6000 /tmp/run.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(无 /tmp/run.log)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # main.py 失败时也让本步骤执行:把 index.json 里记录的 failed 状态提交上去
      - name: Commit artifacts & index
        if: ${{ !cancelled() }}
        env:
          CF_URL: ${{ inputs.cf_url }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p packs
          git add packs
          # 首次运行时 index.json 可能尚未生成
          if [ -f index.json ]; then
            git add index.json
          fi
          if git diff --cached --quiet; then
            echo "无产物变更,跳过提交"
            exit 0
          fi
          git commit -m "chore(packs): translate ${CF_URL}"
          # 并发或期间有新提交时:rebase 后重推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
