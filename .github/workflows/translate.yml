# 手动触发:输入一个 CurseForge 整合包链接 → main.py 跑翻译 → 产物 commit 回仓库。
# 产物结构约定:packs/{source}/{projectID}/{fileID}/zh_cn.snbt + meta.json,
# 根目录 index.json 由 src/index_store.py 维护。
# 面向玩家的 issue 提交通道见 on-issue.yml。
name: Translate Modpack

on:
  workflow_dispatch:
    inputs:
      cf_url:
        description: "CurseForge 整合包链接(整包页或某版本/文件页)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    name: Fetch & Translate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Self-test index store
        run: python -m src.index_store selftest

      # 退出码:0=done(或此前已汉化) / 2=no_ftbq / 1=failed / 3=环境未就绪
      - name: Translate modpack
        id: translate
        env:
          CF_URL: ${{ inputs.cf_url }}
        run: python main.py "$CF_URL"

      # main.py 失败时也让本步骤执行:把 index.json 里记录的 failed 状态提交上去
      - name: Commit artifacts & index
        if: ${{ !cancelled() }}
        env:
          CF_URL: ${{ inputs.cf_url }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p packs
          git add packs
          # 首次运行时 index.json 可能尚未生成
          if [ -f index.json ]; then
            git add index.json
          fi
          if git diff --cached --quiet; then
            echo "无产物变更,跳过提交"
            exit 0
          fi
          git commit -m "chore(packs): translate ${CF_URL}"
          # 并发或期间有新提交时:rebase 后重推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
