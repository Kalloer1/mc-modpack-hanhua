# 玩家提交通道(安全:浏览器侧不需要任何 Token)
#   新建 issue(带 submit 标签,或标题/正文里含 CurseForge 链接)
#     -> 解析链接 -> 跑 main.py -> 产物 commit 回仓库
#     -> 在该 issue 下回评结果(成功给下载路径 / 失败给原因)并打 done/failed 标签。
# 幂等:已带 done/failed 标签的 issue 不再重复跑;同一 issue 用 concurrency 串行。
name: Translate from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  translate:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # issue 标题/正文是外部输入 -> 一律走 env 传参,绝不用 ${{ }} 直接拼进 shell
      - name: Parse issue
        id: gate
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          python - <<'PY'
          import os, re

          labels = [x.strip() for x in (os.environ.get("ISSUE_LABELS") or "").split(",") if x.strip()]
          text = (os.environ.get("ISSUE_TITLE") or "") + "\n" + (os.environ.get("ISSUE_BODY") or "")
          m = re.search(
              r"https?://(?:www\.)?curseforge\.com/minecraft/modpacks/[A-Za-z0-9._-]+(?:/files/\d+)?",
              text, re.I,
          )
          url = m.group(0) if m else ""

          processed = any(l in ("done", "failed") for l in labels)
          should_run = "true" if (url or "submit" in labels) and not processed else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={should_run}\n")
              f.write(f"url={url}\n")
          print(f"labels={labels} url={url!r} should_run={should_run}")
          PY

      - name: Snapshot index.json
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          rm -f "$RUNNER_TEMP/index.before.json"
          if [ -f index.json ]; then
            cp index.json "$RUNNER_TEMP/index.before.json"
          fi

      # 退出码:0=done(或此前已汉化) / 2=no_ftbq / 1=failed / 3=环境未就绪
      # 0 和 2 都算“流程走通”,不算 CI 失败;1/3 让本步骤变红。
      - name: Run main.py
        id: translate
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        env:
          CF_URL: ${{ steps.gate.outputs.url }}
        run: |
          set -uo pipefail
          if [ -z "${CF_URL:-}" ]; then
            echo "issue 标题/正文中未找到 CurseForge 整合包链接。" | tee "$RUNNER_TEMP/main.log"
            echo 3 > "$RUNNER_TEMP/exit_code"
            exit 1
          fi
          set +e
          python main.py "$CF_URL" 2>&1 | tee "$RUNNER_TEMP/main.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "$RUNNER_TEMP/exit_code"
          if [ "$code" = "0" ] || [ "$code" = "2" ]; then
            exit 0
          fi
          echo "::error::main.py 退出码 $code(1=翻译失败,3=环境未就绪)"
          exit 1

      # 对比 main.py 前后的 index.json 找出本次写入的条目;日志脱敏后再进评论。
      - name: Collect result
        id: result
        if: ${{ !cancelled() && steps.gate.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          repo = os.environ.get("GH_REPO", "")
          branch = os.environ.get("DEFAULT_BRANCH") or "main"
          run_url = os.environ.get("RUN_URL", "")

          try:
              code = int((tmp / "exit_code").read_text(encoding="utf-8").strip())
          except Exception:
              code = 1

          log_text = ""
          try:
              log_text = (tmp / "main.log").read_text(encoding="utf-8", errors="replace")
          except Exception:
              pass
          # issue 评论是公开的:把密钥值从日志里抹掉
          for key in ("CURSEFORGE_API_KEY", "GEMINI_API_KEY"):
              value = os.environ.get(key) or ""
              if value:
                  log_text = log_text.replace(value, "[REDACTED]")

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def keyed(data):
              out = {}
              for e in data.get("entries") or []:
                  out[(e.get("source"), str(e.get("projectId")), str(e.get("fileId")))] = e
              return out

          before = keyed(load(tmp / "index.before.json"))
          after = keyed(load(Path("index.json")))
          changed = [v for k, v in after.items() if before.get(k) != v]
          entry = changed[0] if changed else {}

          status = entry.get("status") or {0: "done", 2: "no_ftbq"}.get(code, "failed")
          name = entry.get("name") or ""
          path = entry.get("path") or ""
          stats = entry.get("stats") or {}

          # 已汉化过的包重跑时 index 不会变化:从日志兜底找产物路径
          if not path:
              m = re.search(r"产出:\s*(\S+?)/zh_cn\.snbt", log_text)
              if m:
                  path = m.group(1)
          if not path:
              m = re.search(r"\((packs/[^)]+)\)", log_text)
              if m:
                  path = m.group(1)

          failed = status not in ("done", "already_localized", "no_ftbq") or code in (1, 3)
          label = "failed" if failed else "done"

          download = ""
          if status == "done" and path:
              download = f"https://raw.githubusercontent.com/{repo}/{branch}/{path}/zh_cn.snbt"

          title = {
              "done": "翻译完成",
              "already_localized": "该整合包已自带中文",
              "no_ftbq": "该整合包没有 FTB Quests 任务",
              "failed": "处理失败",
          }.get(status, "处理结果")

          lines = [f"## {'❌' if failed else '✅'} {title}", ""]
          if failed:
              lines.append("自动处理没有成功:")
              lines.append("")
              if stats.get("error"):
                  lines.append(f"- 原因:`{str(stats['error'])[:400]}`")
              tail = "\n".join(log_text.splitlines()[-12:]).strip() or "(无日志)"
              lines += ["", "日志尾部:", "", "```text", tail, "```", ""]
              lines.append(f"- 退出码:`{code}`(1=翻译失败,3=环境未就绪/未找到链接)")
              lines.append("- 如果是链接填错,可直接编辑本 issue 修正后重新加 `submit` 标签重试。")
          else:
              if name:
                  lines.append(f"- 整合包:`{name}`")
              lines.append(f"- 状态:`{status}`")
              if path:
                  lines.append(f"- 产物:`{path}/zh_cn.snbt`")
              if download:
                  lines.append(f"- 下载:<{download}>")
              if status == "no_ftbq":
                  lines.append("- 说明:包内未检测到 FTB Quests 任务,不需要汉化文件。")
              elif status == "done" and not download:
                  lines.append("- 说明:该整合包此前已汉化,直接用仓库里的现有文件。")
              if stats:
                  brief = json.dumps(stats, ensure_ascii=False)
                  lines.append(f"- 统计:`{brief[:300]}`")
          lines.append("")
          lines.append(f"<sub>🤖 由 CI 自动处理 · [查看运行日志]({run_url})</sub>")

          (tmp / "comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"label={label}\n")
              f.write(f"status={status}\n")
          print(f"status={status} label={label} path={path!r} download={download!r}")
          PY

      - name: Commit artifacts & index
        if: ${{ !cancelled() && steps.gate.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p packs
          git add packs
          if [ -f index.json ]; then
            git add index.json
          fi
          if git diff --cached --quiet; then
            echo "无产物变更,跳过提交"
            exit 0
          fi
          git commit -m "chore(packs): translate from #${ISSUE_NUMBER}"
          # 并发或期间有新提交时:rebase 后重推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Comment & label
        if: ${{ !cancelled() && steps.gate.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          # 标签不存在时 --add-label 会失败,先确保三个标签都在
          gh label create submit --color 0075ca --description "整合包提交(待处理)" 2>/dev/null || true
          gh label create done   --color 2ea44f --description "翻译完成" 2>/dev/null || true
          gh label create failed --color d73a4a --description "翻译失败" 2>/dev/null || true

          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" --add-label "${{ steps.result.outputs.label }}"
          echo "已回评并打标签:${{ steps.result.outputs.label }}"
